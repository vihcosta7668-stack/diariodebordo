<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Diário de bordo · Trabalho</title>
<script>try{var tm=localStorage.getItem('agenda-trabalho-tema');if(tm)document.documentElement.dataset.theme=tm}catch(e){}</script>
<style>
:root{
  color-scheme:dark;
  --bg:#0E1014; --side:#12151B; --card:#171B22; --card2:#1E232C; --line:#272C36;
  --ink:#E8EAEE; --muted:#8D95A3; --faint:#5C6370;
  --accent:#FDBA12; --accent-soft:rgba(253,186,18,.14);
  --ok:#2BC48A; --late:#FF6B5B; --late-soft:rgba(255,107,91,.14);
  --top:rgba(14,16,20,.92); --chk:#475061; --rot:#3A4150; --sel:#2A2F3A; --dash:#3A4150;
  --foco-a:#2A2208; --foco-b:#5A4610; --on-accent:#111;
  --r:14px;
}
/* temas */
:root[data-theme=claro]{
  color-scheme:light;
  --bg:#F4F5F7; --side:#FFFFFF; --card:#FFFFFF; --card2:#EEF0F3; --line:#DFE2E8;
  --ink:#1B1F27; --muted:#5E6675; --faint:#8E95A2;
  --accent:#B07800; --accent-soft:rgba(176,120,0,.12);
  --ok:#1E9E6E; --late:#D64533; --late-soft:rgba(214,69,51,.12);
  --top:rgba(244,245,247,.92); --chk:#B8BEC9; --rot:#C5CAD3; --sel:#E3E7EE; --dash:#C5CAD3;
  --foco-a:#FFF4D6; --foco-b:#E9C46A; --on-accent:#111;
}
:root[data-theme=azul]{
  --bg:#0B1424; --side:#0F1A2E; --card:#132139; --card2:#1A2A45; --line:#24365A;
  --ink:#E6ECF5; --muted:#8FA1BD; --faint:#5E6F8C;
  --accent:#5AA9FF; --accent-soft:rgba(90,169,255,.15);
  --ok:#34C79A; --late:#FF6B6B; --late-soft:rgba(255,107,107,.15);
  --top:rgba(11,20,36,.92); --chk:#3E5378; --rot:#33476A; --sel:#22355A; --dash:#33476A;
  --foco-a:#10284A; --foco-b:#2C5A92; --on-accent:#0B1424;
}
:root[data-theme=sepia]{
  color-scheme:light;
  --bg:#F3ECDD; --side:#F9F4E8; --card:#FCF8EF; --card2:#EEE5D2; --line:#DCCFB5;
  --ink:#2F2A22; --muted:#6E6453; --faint:#9A8F7B;
  --accent:#A85A1F; --accent-soft:rgba(168,90,31,.12);
  --ok:#3D8B57; --late:#B83A2B; --late-soft:rgba(184,58,43,.12);
  --top:rgba(243,236,221,.92); --chk:#B9AC92; --rot:#CDBF9F; --sel:#E6DAC1; --dash:#C9BA9A;
  --foco-a:#F6E3C9; --foco-b:#D9AE7E; --on-accent:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:76px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* estrutura */
.side{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--side);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.brand{display:none}
#tabs{display:flex;justify-content:space-around}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11px;font-weight:600;color:var(--muted)}
#tabs button.on{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:var(--top);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
#hdr-center{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.dt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.dt b{font-size:19px}
.dt span{font-size:13px;color:var(--muted)}
.nav{width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--muted);background:var(--card)}
.nav:hover{color:var(--ink)}
.hoje{padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.top-r{display:flex;align-items:center;gap:8px}
#sync{font-size:12px;color:var(--faint);white-space:nowrap}
#sync.ok{color:var(--ok)} #sync.err{color:var(--late)}
.aa{height:32px;padding:0 10px;border-radius:9px;background:var(--card);color:var(--muted);font-size:13px;font-weight:700}
main{max-width:1280px;margin:0 auto;padding:14px 16px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.stack{display:flex;flex-direction:column;gap:12px}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}
.daygrid{display:flex;flex-direction:column;gap:12px}
.daygrid .col{display:contents}

/* resumo */
.resumo{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%}
.ring circle{fill:none;stroke-width:8}
.rg-bg{stroke:var(--card2)}
.rg-fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dasharray .4s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:17px}
.kpis{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpis div{background:var(--card2);border-radius:10px;padding:8px 6px;text-align:center}
.kpis b{display:block;font-size:20px;line-height:1.1}
.kpis span{font-size:11px;color:var(--muted)}
.kpis .lt b{color:var(--late)}
.kpis .okk b{color:var(--ok)}

/* captura */
.add input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;outline:none}
.add input:focus{border-color:var(--accent)}
.add input::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sep{width:1px;background:var(--line);margin:0 4px}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:10px;background:var(--card2);border:1px solid transparent}
.wk.sel{border-color:var(--accent)}
.wk.today b{color:var(--accent)}
.wk-bar{height:86px;width:70%;max-width:30px;display:flex;flex-direction:column-reverse;gap:2px}
.wk-bar i{display:block;border-radius:3px;min-height:4px}
.wk-bar i.rot{background:var(--rot)}
.wk-bar i.fd{opacity:.28}
.wk b{font-size:12px}
.wk span{font-size:11px;color:var(--muted)}
.wk-leg{font-size:11px;color:var(--faint);margin-top:8px}

/* itens */
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.cbar{width:3px;align-self:stretch;border-radius:3px;flex:none}
.chk{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--chk);margin-top:1px;display:grid;place-items:center;background:transparent}
.chk:hover{border-color:var(--ok)}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .chk::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.txt{flex:1;min-width:0;cursor:pointer}
.tt{word-wrap:break-word}
.done .tt{text-decoration:line-through;color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%}
.late{color:var(--late);font-weight:600}
.hora{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.acts{display:flex;gap:4px;flex:none}
.acts button{font-size:12px;padding:5px 9px;border-radius:8px;background:var(--card2);color:var(--muted)}
.acts button:hover{color:var(--ink)}
.crono{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crono:hover{color:var(--ink)}
.crono.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.ckl{display:flex;flex-direction:column;margin-top:6px}
.ck-i{display:flex;align-items:center;gap:8px;width:100%;padding:3px 0;text-align:left;font-size:13px}
.ck-b{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--chk);display:grid;place-items:center}
.ck-i.d .ck-b{background:var(--ok);border-color:var(--ok)}
.ck-i.d .ck-b::after{content:"";width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck-i .x{flex:1;min-width:0;word-wrap:break-word}
.ck-i.d .x{text-decoration:line-through;color:var(--faint)}
.ck-i .dd{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ck-i .dd.late{color:var(--late);font-weight:600}
.ck-e{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.f .ck-e input[type=checkbox]{width:18px;height:18px;flex:none}
.f .ck-e input[name=ck_txt],.f .ck-add input:not([type]){flex:1 1 140px;min-width:0;width:auto}
.f .ck-e input[type=date],.f .ck-add input[type=date]{flex:0 0 auto;width:auto}
.ck-e button{color:var(--faint);font-size:18px;line-height:1;padding:0 4px}
.ck-add{display:flex;flex-wrap:wrap;gap:6px}
.empty-msg{color:var(--faint);font-size:14px;padding:4px 0}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
.link{color:var(--accent);font-size:14px;font-weight:600}

/* foco */
.foco{background:linear-gradient(135deg,var(--foco-a),var(--card) 70%);border-color:var(--foco-b)}
.foco h2{color:var(--accent)}
.foco .big{font-size:21px;font-weight:650;margin:2px 0 12px}
.foco .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.foco button{padding:8px 12px;border-radius:10px;background:var(--card2);font-size:14px}
.foco button.pri{background:var(--accent);color:var(--on-accent);font-weight:700}
#tmr:empty{display:none}
#tmr{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:80px}

/* frentes mini */
.fm{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 26px;align-items:center;gap:10px;width:100%;padding:6px 0;text-align:left}
.fm-n{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-n i{width:9px;height:9px;border-radius:50%;flex:none}
.fm-b{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.fm-b i{display:block;height:100%;border-radius:99px}
.fm b{text-align:right;font-size:14px}

/* diário */
.log-form{display:flex;gap:8px;align-items:flex-end}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;background:var(--bg);outline:none}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--faint)}
.btn{padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px;white-space:nowrap}
.btn.sec{background:var(--card2);color:var(--ink);font-weight:600}
.btn.warn{background:var(--late-soft);color:var(--late)}
.log{list-style:none;margin:10px 0 0;padding:0}
.log li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.log li .h{color:var(--accent);font-variant-numeric:tabular-nums;flex:none;width:42px;font-weight:600}
.log li .x{flex:1;white-space:pre-wrap;word-wrap:break-word}
.log li.auto .h,.log li.auto .x{color:var(--faint)}
.log li button{color:var(--faint);font-size:16px;line-height:1}

/* mês */
.mesgrid{display:flex;flex-direction:column;gap:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px;text-transform:uppercase}
.cell{position:relative;aspect-ratio:1/1.1;border-radius:10px;background:var(--card2);border:1px solid transparent;padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:46px;overflow:hidden}
.cell.empty{background:transparent}
.cell.past{opacity:.6}
.cell .n{font-size:13px;font-weight:700}
.cell.today{border-color:var(--accent)}
.cell.today .n{color:var(--accent)}
.cell.sel{background:var(--sel)}
.cell .c{position:absolute;top:4px;right:4px;font-size:11px;font-weight:700;background:var(--line);border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.cell.haslate{opacity:1}
.cell.haslate .c{background:var(--late);color:#111}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
.cell .dots i{width:7px;height:7px;border-radius:50%}
.ttls{display:none}
.ttl{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--card);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl.d{color:var(--faint);text-decoration:line-through}
.more{font-size:11px;color:var(--muted)}
.cell .r{font-size:10px;color:var(--faint);margin-top:auto}
.cell .lg{position:absolute;bottom:6px;right:6px;width:10px;height:3px;border-radius:2px;background:var(--accent)}
.legend{font-size:12px;color:var(--faint);margin-top:10px}
.mrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center;cursor:pointer}
.mrow:first-of-type{border-top:0}
.mrow .d{width:44px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .cbar{height:18px;align-self:center}

/* frentes */
.frgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
.fr{border-top:4px solid var(--c)}
.fr-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fr-h b{font-size:16px;flex:1}
.fr-p{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px;color:var(--muted)}
.fr-p .bar{flex:1;height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.fr-p .bar i{display:block;height:100%;background:var(--c)}
.inline-add{display:flex;gap:6px;margin-top:8px}
.inline-add input{flex:1;padding:8px 10px;border:1px dashed var(--dash);border-radius:10px;background:var(--bg);outline:none}
.inline-add input:focus{border-style:solid;border-color:var(--accent)}
.inline-add input::placeholder{color:var(--faint)}
.small-btn{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--card2);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.intro{margin:0 0 12px}

/* rotinas */
.rtgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rt{cursor:pointer;border-left:4px solid var(--c)}
.rt .tt{font-weight:600;margin-bottom:8px}
.wdots{display:flex;gap:5px}
.wdots span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--card2);color:var(--faint)}
.wdots span.on{background:var(--c);color:#111}
.mbadge{display:inline-flex;align-items:baseline;gap:4px;background:var(--card2);border-radius:8px;padding:4px 10px}
.mbadge b{font-size:20px;color:var(--c)}
.mbadge span{font-size:12px;color:var(--muted)}
.rt .foot{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.rt.warn{border-left-color:var(--accent);background:linear-gradient(90deg,rgba(253,186,18,.08),var(--card) 60%)}
.secttl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:16px 0 8px}

/* formulários */
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none;width:100%}
.f input:focus,.f select:focus{border-color:var(--accent)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick input{display:none}
.daypick span{display:block;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:500}
.daypick input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{display:none}
.swatches span{display:block;width:28px;height:28px;border-radius:50%;border:3px solid var(--card2)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btns .grow{flex:1}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.seg .tsw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid var(--line);vertical-align:-1px}
dialog{border:1px solid var(--line);border-radius:16px;padding:18px;width:min(460px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 12px;font-size:17px}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}

@media (max-width:899px){
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-14px;padding-right:14px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
}
/* celular estreito */
@media (max-width:420px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .ring{width:64px;height:64px}
  .acts button{padding:5px 7px}
  .cell{padding:3px}
  .cell .r{display:none}
  .wk-bar{height:64px}
}
/* tablet e computador: barra lateral */
@media (min-width:900px){
  body{padding-bottom:0;padding-left:210px}
  .side{top:0;bottom:0;right:auto;width:210px;border-top:0;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
  .brand{display:block;padding:0 10px}
  .brand b{display:block;font-size:16px}
  .brand span{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  #tabs{flex-direction:column;gap:2px}
  #tabs button{flex-direction:row;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;justify-content:flex-start}
  #tabs button:hover{background:var(--card)}
  #tabs button.on{background:var(--accent-soft)}
  .top-in,main{padding-left:24px;padding-right:24px}
  .cell{aspect-ratio:auto;min-height:104px;padding:6px}
  .ttls{display:flex;flex-direction:column;gap:2px}
  .cell .dots{display:none}
  #toast{bottom:28px;left:calc(50% + 105px)}
}
/* tela larga: duas colunas */
@media (min-width:1150px){
  .daygrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,1fr);gap:16px;align-items:start}
  .daygrid .col{display:flex;flex-direction:column;gap:14px}
  .mesgrid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr);gap:16px;align-items:start}
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><b>Diário de bordo</b><span>Trabalho</span></div>
  <nav id="tabs">
    <button data-act="view" data-v="dia"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Dia</button>
    <button data-act="view" data-v="mes"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês</button>
    <button data-act="view" data-v="frentes"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>Frentes</button>
    <button data-act="view" data-v="rotinas"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8M20 4v4h-4M20 12a8 8 0 0 1-13.7 5.7L4 16M4 20v-4h4"/></svg>Rotinas</button>
    <button data-act="view" data-v="ajustes"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
  </nav>
</aside>
<header class="top"><div class="top-in"><div id="hdr-center"></div><div class="top-r"><span id="sync"></span><button class="aa" data-act="escala" title="Tamanho da tela">Aa</button></div></div></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
'use strict';
const KEY='agenda-trabalho-v1', GHKEY='agenda-trabalho-github', ESCKEY='agenda-trabalho-escala', TEMAKEY='agenda-trabalho-tema', TITLE='Diário de bordo · Trabalho';
const COLORS=['#FDBA12','#4F8CFF','#2BC48A','#B07CFF','#FF7A45','#22C7D6','#F25C8A','#94A3B8'];
const ESCALAS=[{v:.9,n:'Compacta'},{v:1,n:'Normal'},{v:1.15,n:'Grande'}];
const TEMAS=[{v:'escuro',n:'Escuro',c:'#0E1014'},{v:'claro',n:'Claro',c:'#F4F5F7'},{v:'azul',n:'Azul-noite',c:'#0B1424'},{v:'sepia',n:'Sépia',c:'#F3ECDD'}];
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_L=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diffDays=(a,b)=>Math.round((fromYmd(a)-fromYmd(b))/864e5);
const agoraHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const curto=s=>{const d=fromYmd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dados ---------- */
function seed(){
  const t=today();
  const r=(titulo,frente,tipo)=>({id:uid(),titulo,frente,tipo,dias:[],dia:null,hora:'',criada:t});
  return {
    v:1, updatedAt:0,
    frentes:[
      {id:'gfc',nome:'Cobranças GFC',cor:'#FDBA12'},
      {id:'mrod',nome:'Material rodante',cor:'#4F8CFF'},
      {id:'planilhas',nome:'Contratos e planilhas',cor:'#2BC48A'},
      {id:'ferram',nome:'Ferramentas e automação',cor:'#B07CFF'},
      {id:'ml',nome:'Projeto ML',cor:'#FF7A45'},
      {id:'metas',nome:'Plano de Metas 2026',cor:'#22C7D6'}
    ],
    rotinas:[
      r('Cobrar horímetros dos CSPs (e-mail)','gfc','mensal'),
      r('Cobrar histórico de trocas / mapa de componentes','gfc','mensal'),
      r('Atualizar ROM no sistema (depois do horímetro)','gfc','mensal'),
      r('Verificar vida útil e forecast e enviar aos CSPs','gfc','mensal'),
      r('Montar apresentação semanal de material rodante','mrod','semanal')
    ],
    tarefas:[], feitosRotina:{}, diario:{}, foco:null
  };
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.v!==1)S=seed();

function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não consegui salvar neste navegador.')}}
function save(){S.updatedAt=Date.now();persistLocal();schedulePush();}

const frente=id=>S.frentes.find(f=>f.id===id);
const cor=id=>(frente(id)||{}).cor||'#5C6370';
const pill=id=>{const f=frente(id);return f?`<span class="pill"><i style="background:${f.cor}"></i>${esc(f.nome)}</span>`:''};

/* ---------- escala da tela ---------- */
function getEsc(){const v=parseFloat(localStorage.getItem(ESCKEY));return ESCALAS.some(e=>e.v===v)?v:1}
function aplicarEsc(v){document.body.style.zoom=v===1?'':v;try{localStorage.setItem(ESCKEY,v)}catch(e){}}

/* ---------- tema ---------- */
function getTema(){let v='';try{v=localStorage.getItem(TEMAKEY)}catch(e){}return TEMAS.some(t=>t.v===v)?v:'escuro'}
function aplicarTema(v){
  const t=TEMAS.find(x=>x.v===v)||TEMAS[0];
  if(t.v==='escuro')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t.v;
  document.querySelector('meta[name=theme-color]').content=t.c;
  try{localStorage.setItem(TEMAKEY,t.v)}catch(e){}
}

/* ---------- tempo por tarefa ---------- */
const tempoT=t=>(t.tempo||0)+(t.rodando?Date.now()-t.rodando:0);
function fmtDur(ms,seg){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  if(seg)return (h?h+':':'')+pad(m)+':'+pad(s%60);
  return h?h+'h'+(m?' '+pad(m)+'min':''):m+'min';
}
function pararCrono(t){if(t.rodando){t.tempo=tempoT(t);t.rodando=null}}
function cronoToggle(id){
  const t=S.tarefas.find(x=>x.id===id); if(!t)return;
  if(t.rodando)pararCrono(t);
  else{S.tarefas.forEach(pararCrono);t.rodando=Date.now()}  // um cronômetro por vez
  save();render();
}

/* ---------- rotinas ---------- */
function rotOcorre(r,d){
  if(r.pausada)return false;
  const dt=fromYmd(d),w=dt.getDay();
  switch(r.tipo){
    case 'diaria':return true;
    case 'uteis':return w>0&&w<6;
    case 'semanal':return (r.dias||[]).includes(w);
    case 'mensal':{if(!r.dia)return false;const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();return dt.getDate()===Math.min(r.dia,last)}
  }
  return false;
}
const rotSemConfig=r=>(r.tipo==='mensal'&&!r.dia)||(r.tipo==='semanal'&&!(r.dias||[]).length);
function diasDaSemana(r){return r.tipo==='diaria'?[0,1,2,3,4,5,6]:r.tipo==='uteis'?[1,2,3,4,5]:r.tipo==='semanal'?(r.dias||[]):[]}
const feitoRot=(rid,d)=>!!(S.feitosRotina[d]&&S.feitosRotina[d][rid]);
function ultimaAntes(r,d,lim){for(let i=1;i<=lim;i++){const x=addDays(d,-i);if(rotOcorre(r,x))return x}return null}

function rotinasDia(d){
  const lista=S.rotinas.filter(r=>rotOcorre(r,d)).map(r=>({r,d,done:feitoRot(r.id,d),late:0}));
  if(d===today()){
    // mensais e semanais esquecidas continuam aparecendo até serem feitas
    S.rotinas.forEach(r=>{
      if((r.tipo!=='mensal'&&r.tipo!=='semanal')||rotOcorre(r,d))return;
      const x=ultimaAntes(r,d,r.tipo==='mensal'?31:6);
      if(x&&x>=(r.criada||'')&&!feitoRot(r.id,x))lista.push({r,d:x,done:false,late:diffDays(d,x)});
    });
  }
  return lista.sort((a,b)=>(b.late-a.late)||((a.r.hora||'99')>(b.r.hora||'99')?1:-1));
}
function tarefasDia(d){
  const hoje=d===today();
  return S.tarefas.filter(t=>t.data===d||(hoje&&t.data&&t.data<d&&!t.done))
    .sort((a,b)=>(a.done-b.done)||((a.data||'')<(b.data||'')?-1:(a.data||'')>(b.data||'')?1:0)||(a.criada-b.criada));
}

/* ---------- interface ---------- */
let view='dia', cur=today(), mesCur=today().slice(0,7), addWhen='dia', addFrente='';

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  renderHeader();
  const v={dia:viewDia,mes:viewMes,frentes:viewFrentes,rotinas:viewRotinas,ajustes:viewAjustes}[view];
  $('#app').innerHTML=v();
  if(view==='dia')tick();
  renderSync();
}
function renderHeader(){
  const h=$('#hdr-center');
  if(view==='dia'){
    const dt=fromYmd(cur),t=today();
    const rel=cur===t?'Hoje':cur===addDays(t,1)?'Amanhã':cur===addDays(t,-1)?'Ontem':DIAS_L[dt.getDay()];
    const sub=(rel!==DIAS_L[dt.getDay()]?DIAS_L[dt.getDay()].toLowerCase()+', ':'')+dt.getDate()+' de '+MESES[dt.getMonth()];
    h.innerHTML=`<button class="nav" data-act="prev" aria-label="Dia anterior">‹</button><button class="nav" data-act="next" aria-label="Próximo dia">›</button><div class="dt"><b>${rel}</b><span>${sub}</span></div>${cur!==t?'<button class="hoje" data-act="gohoje">Hoje</button>':''}`;
  }else if(view==='mes'){
    const [y,m]=mesCur.split('-').map(Number);
    h.innerHTML=`<button class="nav" data-act="prev" aria-label="Mês anterior">‹</button><button class="nav" data-act="next" aria-label="Próximo mês">›</button><div class="dt"><b>${MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)}</b><span>${y}</span></div>${mesCur!==today().slice(0,7)?'<button class="hoje" data-act="gohoje">Hoje</button>':''}`;
  }else{
    h.innerHTML=`<div class="dt"><b>${{frentes:'Frentes',rotinas:'Rotinas',ajustes:'Ajustes'}[view]}</b><span>${{frentes:'o que corre em paralelo',rotinas:'o que se repete',ajustes:'tema, tela, dados e sincronização'}[view]}</span></div>`;
  }
}

function rowTarefa(t,d){
  const late=t.data&&t.data<d&&!t.done?diffDays(d,t.data):0;
  const quando=view!=='dia'?(t.data?`<span>${curto(t.data)}</span>`:'<span>sem data</span>'):'';
  const acts=t.done?'':view==='dia'
    ?`<div class="acts"><button data-act="foco" data-id="${t.id}">Focar</button><button data-act="${late?'prahoje':'amanha'}" data-id="${t.id}">${late?'Hoje':'Amanhã'}</button></div>`
    :`<div class="acts"><button data-act="prahoje" data-id="${t.id}">Hoje</button></div>`;
  const ms=tempoT(t), ck=t.check||[], ckOk=ck.filter(c=>c.done).length;
  const crono=t.done?(ms>=60000?`<span class="pill">⏱ ${fmtDur(ms)}</span>`:'')
    :`<button class="crono ${t.rodando?'on':''}" data-act="crono" data-id="${t.id}" title="${t.rodando?'Pausar contagem':'Contar tempo nesta tarefa'}">${t.rodando?'■':'▶'} <span data-crono="${t.id}">${t.rodando?fmtDur(ms,true):ms>=60000?fmtDur(ms):'Tempo'}</span></button>`;
  const lista=!t.done&&ck.length?`<div class="ckl">${ck.map(c=>{
    const atr=c.data&&!c.done&&c.data<today();
    return `<button class="ck-i ${c.done?'d':''}" data-act="tgl-ck" data-id="${t.id}" data-ck="${c.id}"><span class="ck-b"></span><span class="x">${esc(c.txt)}</span>${c.data?`<span class="dd ${atr?'late':''}">${curto(c.data)}</span>`:''}</button>`;
  }).join('')}</div>`:'';
  return `<div class="item ${t.done?'done':''}"><span class="cbar" style="background:${cor(t.frente)}"></span><button class="chk" data-act="tgl-t" data-id="${t.id}" aria-label="Concluir"></button>
  <div class="txt" data-act="edit-t" data-id="${t.id}"><div class="tt">${esc(t.titulo)}</div>
  <div class="meta">${view==='frentes'?'':pill(t.frente)}${quando}${late?`<span class="late">atrasada ${late} dia${late>1?'s':''}</span>`:''}${crono}${ck.length?`<span>☑ ${ckOk}/${ck.length}</span>`:''}${t.nota?'<span>· tem nota</span>':''}</div>${lista}</div>${acts}</div>`;
}
function rowRotina(x){
  const r=x.r;
  return `<div class="item ${x.done?'done':''}"><span class="cbar" style="background:${cor(r.frente)}"></span><button class="chk" data-act="tgl-r" data-id="${r.id}" data-d="${x.d}" aria-label="Concluir"></button>
  <div class="txt" data-act="edit-r" data-id="${r.id}"><div class="tt">${esc(r.titulo)}</div>
  <div class="meta">${r.hora?`<span class="hora">${r.hora}</span>`:''}${pill(r.frente)}${x.late?`<span class="late">era ${curto(x.d)} · ${x.late} dia${x.late>1?'s':''} atrás</span>`:''}</div></div></div>`;
}

function cardSemana(){
  const td=today(), seg=addDays(cur,-((fromYmd(cur).getDay()+6)%7));
  const dias=[];
  for(let i=0;i<7;i++){
    const d=addDays(seg,i);
    const ts=S.tarefas.filter(t=>t.data===d).sort((a,b)=>a.done-b.done);
    const rs=S.rotinas.filter(r=>rotOcorre(r,d));
    dias.push({d,ts,rs});
  }
  const max=Math.max(5,...dias.map(x=>x.ts.length+x.rs.length));
  const h=100/max;
  return `<div class="card o4"><h2>Semana <small>${curto(seg)} a ${curto(addDays(seg,6))}</small></h2><div class="week">${dias.map(x=>{
    const dt=fromYmd(x.d);
    const segs=x.rs.map(r=>`<i class="rot ${feitoRot(r.id,x.d)?'fd':''}" style="height:${h}%"></i>`).join('')+x.ts.map(t=>`<i class="${t.done?'fd':''}" style="height:${h}%;background:${cor(t.frente)}"></i>`).join('');
    return `<button class="wk ${x.d===cur?'sel':''} ${x.d===td?'today':''}" data-act="goday" data-d="${x.d}"><span class="wk-bar">${segs}</span><b>${DIAS[dt.getDay()]}</b><span>${dt.getDate()}</span></button>`;
  }).join('')}</div><div class="wk-leg">Cada bloco é uma tarefa na cor da frente; cinza é rotina; apagado é feito.</div></div>`;
}
function cardFrentesMini(){
  const at=S.frentes.filter(f=>!f.arquivada);
  const cnt=at.map(f=>S.tarefas.filter(t=>t.frente===f.id&&!t.done).length);
  const mx=Math.max(1,...cnt);
  return `<div class="card o8"><h2>Frentes <button class="small-btn" data-act="view" data-v="frentes">abrir</button></h2>${at.map((f,i)=>`<button class="fm" data-act="view" data-v="frentes"><span class="fm-n"><i style="background:${f.cor}"></i>${esc(f.nome)}</span><span class="fm-b"><i style="width:${cnt[i]/mx*100}%;background:${f.cor}"></i></span><b>${cnt[i]}</b></button>`).join('')||'<div class="empty-msg">Nenhuma frente ativa.</div>'}</div>`;
}

function viewDia(){
  const d=cur, rots=rotinasDia(d), tars=tarefasDia(d);
  const pend=tars.filter(t=>!t.done), feitas=tars.filter(t=>t.done);
  const total=rots.length+tars.length, ok=rots.filter(x=>x.done).length+feitas.length;
  const pct=total?Math.round(ok/total*100):0, C=213.6;
  const atras=pend.filter(t=>t.data<d).length+rots.filter(x=>x.late).length;
  const rotOk=rots.filter(x=>x.done).length;
  const lblDia=d===today()?'Hoje':'Neste dia ('+curto(d)+')';

  const resumo=`<div class="card resumo o1"><div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" class="rg-bg"/><circle cx="40" cy="40" r="34" class="rg-fg" stroke-dasharray="${(pct/100*C).toFixed(1)} ${C}" transform="rotate(-90 40 40)"/></svg><span>${pct}%</span></div>
  <div class="kpis"><div><b>${pend.length}</b><span>pendentes</span></div><div class="${atras?'lt':''}"><b>${atras}</b><span>atrasadas</span></div><div><b>${rotOk}/${rots.length}</b><span>rotinas</span></div><div class="okk"><b>${ok}</b><span>feitas</span></div></div></div>`;

  const add=`<div class="card o2"><form class="add" data-form="add"><input id="addt" name="t" placeholder="Nova tarefa — escreva e aperte Enter" autocomplete="off" enterkeyhint="done">
  <div class="chips">
    <button type="button" class="chip ${addWhen==='dia'?'on':''}" data-act="when" data-v="dia">${lblDia}</button>
    <button type="button" class="chip ${addWhen==='amanha'?'on':''}" data-act="when" data-v="amanha">${d===today()?'Amanhã':curto(addDays(d,1))}</button>
    <button type="button" class="chip ${addWhen==='sem'?'on':''}" data-act="when" data-v="sem">Sem data</button>
    <span class="sep"></span>
    ${S.frentes.filter(f=>!f.arquivada).map(f=>`<button type="button" class="chip ${addFrente===f.id?'on':''}" data-act="af" data-v="${f.id}"><i style="background:${f.cor}"></i>${esc(f.nome)}</button>`).join('')}
  </div></form></div>`;

  const ft=S.foco&&S.tarefas.find(t=>t.id===S.foco&&!t.done);
  const foco=ft?`<div class="card foco o3"><h2>Foco agora</h2><div class="big">${esc(ft.titulo)}</div>
    <div class="row" style="margin-bottom:10px"><span id="tmr"></span><button data-act="tmr" data-m="15">15 min</button><button data-act="tmr" data-m="25">25 min</button><button data-act="tmr" data-m="45">45 min</button><button data-act="tmr-stop">Parar</button></div>
    <div class="row"><button class="pri" data-act="tgl-t" data-id="${ft.id}">Concluí</button><button data-act="foco-off">Tirar do foco</button></div></div>`:'';

  const rotina=rots.length?`<div class="card o5"><h2>Rotina <small>${rotOk}/${rots.length}</small></h2>${rots.map(rowRotina).join('')}</div>`:'';

  let tarefas=`<div class="card o6"><h2>Tarefas <small>${pend.length} pendente${pend.length===1?'':'s'}</small></h2>`;
  tarefas+=pend.length?pend.map(t=>rowTarefa(t,d)).join(''):'<div class="empty-msg">Nada pendente para este dia.</div>';
  if(feitas.length)tarefas+=`<details><summary>Concluídas (${feitas.length})</summary>${feitas.map(t=>rowTarefa(t,d)).join('')}</details>`;
  const semData=S.tarefas.filter(t=>!t.data&&!t.done).length;
  if(semData)tarefas+=`<div style="margin-top:10px"><button class="link" data-act="view" data-v="frentes">${semData} tarefa${semData>1?'s':''} sem data nas frentes →</button></div>`;
  tarefas+='</div>';

  const log=(S.diario[d]||[]).slice().reverse();
  const diario=`<div class="card o7"><h2>Diário de bordo</h2><form class="log-form" data-form="log"><textarea name="t" rows="2" placeholder="O que avançou, quem cobrar, o que travou…"></textarea><button class="btn">Registrar</button></form>
  <ul class="log">${log.map(e=>`<li class="${e.auto?'auto':''}"><span class="h">${e.h}</span><span class="x">${esc(e.txt)}</span><button data-act="del-log" data-id="${e.id}" aria-label="Apagar registro">×</button></li>`).join('')}</ul></div>`;

  return `<div class="daygrid"><div class="col">${add}${foco}${rotina}${tarefas}</div><div class="col">${resumo}${cardSemana()}${diario}${cardFrentesMini()}</div></div>`;
}

function viewMes(){
  const [y,m]=mesCur.split('-').map(Number);
  const off=new Date(y,m-1,1).getDay(), nd=new Date(y,m,0).getDate(), td=today();
  let g='<div class="card"><div class="cal">'+DIAS.map(x=>`<div class="wd">${x}</div>`).join('');
  for(let i=0;i<off;i++)g+='<div class="cell empty"></div>';
  for(let day=1;day<=nd;day++){
    const d=`${y}-${pad(m)}-${pad(day)}`;
    const ts=S.tarefas.filter(t=>t.data===d).sort((a,b)=>a.done-b.done), pend=ts.filter(t=>!t.done).length;
    const rs=S.rotinas.filter(r=>rotOcorre(r,d)).length;
    const fs=[...new Set(ts.map(t=>t.frente))].slice(0,5);
    const cls=['cell',d===td?'today':'',d===cur?'sel':'',d<td?'past':'',d<td&&pend?'haslate':''].join(' ');
    g+=`<button class="${cls}" data-act="goday" data-d="${d}"><span class="n">${day}</span>${pend?`<span class="c">${pend}</span>`:''}
      <span class="ttls">${ts.slice(0,3).map(t=>`<span class="ttl ${t.done?'d':''}" style="--c:${cor(t.frente)}">${esc(t.titulo)}</span>`).join('')}${ts.length>3?`<span class="more">+${ts.length-3}</span>`:''}</span>
      <span class="dots">${fs.map(f=>`<i style="background:${cor(f)}"></i>`).join('')}</span>${rs?`<span class="r">${rs} rotina${rs>1?'s':''}</span>`:''}${(S.diario[d]||[]).some(e=>!e.auto)?'<span class="lg"></span>':''}</button>`;
  }
  g+='</div><div class="legend">Número: pendentes (vermelho se o dia já passou) · traço amarelo: diário escrito · toque no dia para abrir.</div></div>';
  const doMes=S.tarefas.filter(t=>t.data&&t.data.slice(0,7)===mesCur).sort((a,b)=>a.data<b.data?-1:1);
  let l=`<div class="card"><h2>Tarefas do mês <small>${doMes.filter(t=>!t.done).length} pendentes de ${doMes.length}</small></h2>`;
  l+=doMes.length?doMes.map(t=>`<div class="mrow" data-act="goday" data-d="${t.data}"><span class="cbar" style="background:${cor(t.frente)}"></span><span class="d">${curto(t.data)}</span><span style="flex:1;${t.done?'text-decoration:line-through;color:var(--faint)':''}">${esc(t.titulo)}</span></div>`).join(''):'<div class="empty-msg">Nenhuma tarefa com data neste mês.</div>';
  return `<div class="mesgrid">${g}${l}</div></div>`;
}

function viewFrentes(){
  const ativas=S.frentes.filter(f=>!f.arquivada);
  const bloco=(f,lista)=>{
    const pend=lista.filter(t=>!t.done), feitas=lista.length-pend.length;
    const c=f?f.cor:'#5C6370';
    return `<div class="card fr" style="--c:${c}"><div class="fr-h"><b>${f?esc(f.nome):'Sem frente'}</b>${f?`<button class="small-btn" data-act="edit-f" data-id="${f.id}">Editar</button>`:''}</div>
    <div class="fr-p"><span>${pend.length} pendente${pend.length===1?'':'s'}</span><span class="bar"><i style="width:${lista.length?feitas/lista.length*100:0}%"></i></span><span>${feitas} feita${feitas===1?'':'s'}</span></div>
    ${pend.map(t=>rowTarefa(t,today())).join('')||'<div class="empty-msg">Nada pendente.</div>'}
    <form class="inline-add" data-form="addf" data-f="${f?f.id:''}"><input name="t" placeholder="Próximo passo${f?' de '+esc(f.nome):''}" autocomplete="off"></form></div>`;
  };
  let h=`<div class="muted intro">Jogue aqui o que não tem data. Quando for fazer, toque em "Hoje".</div><div class="frgrid">`;
  ativas.forEach(f=>{h+=bloco(f,S.tarefas.filter(t=>t.frente===f.id))});
  const orf=S.tarefas.filter(t=>!t.frente||!frente(t.frente));
  if(orf.some(t=>!t.done))h+=bloco(null,orf);
  h+=`</div><div class="btns" style="margin-top:12px"><button class="btn sec" data-act="new-f">Nova frente</button></div>`;
  const arq=S.frentes.filter(f=>f.arquivada);
  if(arq.length)h+=`<details class="card" style="margin-top:12px"><summary>Arquivadas (${arq.length})</summary>${arq.map(f=>`<div class="mrow" data-act="edit-f" data-id="${f.id}"><span class="cbar" style="background:${f.cor}"></span><span style="flex:1">${esc(f.nome)}</span></div>`).join('')}</details>`;
  return h;
}

function viewRotinas(){
  const card=r=>{
    const c=cor(r.frente), falta=rotSemConfig(r), dw=diasDaSemana(r);
    const vis=r.tipo==='mensal'
      ?(r.dia?`<span class="mbadge"><b>${r.dia}</b><span>de cada mês</span></span>`:'<span class="mbadge"><b>?</b><span>escolha o dia do mês</span></span>')
      :`<div class="wdots">${'DSTQQSS'.split('').map((x,i)=>`<span class="${dw.includes(i)?'on':''}">${x}</span>`).join('')}</div>`;
    return `<div class="card rt ${falta?'warn':''}" style="--c:${c}" data-act="edit-r" data-id="${r.id}"><div class="tt">${esc(r.titulo)}</div>${vis}
    <div class="foot">${pill(r.frente)}${r.hora?`<span class="hora">${r.hora}</span>`:''}${falta?'<span class="late" style="color:var(--accent)">falta configurar</span>':''}${r.pausada?'<span>pausada</span>':''}</div></div>`;
  };
  const cfg=S.rotinas.filter(rotSemConfig), sem=S.rotinas.filter(r=>!rotSemConfig(r)&&r.tipo!=='mensal'), mes=S.rotinas.filter(r=>!rotSemConfig(r)&&r.tipo==='mensal').sort((a,b)=>a.dia-b.dia);
  let h=`<div class="muted intro">O que se repete aparece sozinho no dia certo. Mensais e semanais esquecidas continuam no "Hoje" até serem marcadas.</div>`;
  if(cfg.length)h+=`<div class="secttl">Falta escolher o dia</div><div class="rtgrid">${cfg.map(card).join('')}</div>`;
  if(sem.length)h+=`<div class="secttl">Diárias e semanais</div><div class="rtgrid">${sem.map(card).join('')}</div>`;
  if(mes.length)h+=`<div class="secttl">Mensais</div><div class="rtgrid">${mes.map(card).join('')}</div>`;
  if(!S.rotinas.length)h+='<div class="card empty-msg">Nenhuma rotina ainda.</div>';
  h+=`<div class="btns" style="margin-top:14px"><button class="btn sec" data-act="new-r">Nova rotina</button></div>`;
  return h;
}

function dlgRotina(r){

  abrir(`<form data-form="dlg-r" data-id="${r.id}"><h3>${novo?'Nova rotina':'Rotina'}</h3>
  <div class="f"><label>O que é</label><input name="titulo" value="${esc(r.titulo)}" required></div>

  <div class="f"><label>Repete</label><select name="tipo" data-act-change="tipo">
    ${[['diaria','Todo dia'],['uteis','Dias úteis (seg a sex)'],['semanal','Dias da semana'],['mensal','Uma vez por mês']].map(([v,l])=>`<option value="${v}" ${r.tipo===v?'selected':''}>${l}</option>`).join('')}</select></div>

  <div class="f" id="f-dia" ${r.tipo==='mensal'?'':'hidden'}><label>Dia do mês (se o mês for mais curto, cai no último dia)</label><input type="number" name="dia" min="1" max="31" value="${r.dia||''}"></div>
  <div class="f"><label>Horário (opcional)</label><input type="time" name="hora" value="${r.hora||''}"></div>

function dlgFrente(f){

  abrir(`<form data-form="dlg-f" data-id="${f.id}"><h3>${novo?'Nova frente':'Frente'}</h3>

  ${novo?'':`<div class="f"><label><input type="checkbox" name="arquivada" ${f.arquivada?'checked':''}> Arquivar (some das listas, mas guarda o histórico)</label></div>`}

/* ---------- ações ---------- */
function addLog(d,txt,auto){(S.diario[d]=S.diario[d]||[]).push({id:uid(),h:agoraHM(),txt,auto:auto||null})}
function toggleTarefa(id){
  const t=S.tarefas.find(x=>x.id===id); if(!t)return;
  t.done=!t.done;
  if(t.done){
    if(t.data&&t.data<today()&&cur===today())t.data=today();
    pararCrono(t);
    t.feitoEm=Date.now(); addLog(today(),'Concluída: '+t.titulo+(t.tempo>=60000?' ('+fmtDur(t.tempo)+')':''),t.id);
    if(S.foco===t.id){S.foco=null;stopTimer()}
  }else{
    Object.keys(S.diario).forEach(k=>{S.diario[k]=S.diario[k].filter(e=>e.auto!==t.id)});
  }
  save();render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case 'view':view=b.dataset.v;window.scrollTo(0,0);render();break;
    case 'prev':if(view==='dia')cur=addDays(cur,-1);else{const [y,m]=mesCur.split('-').map(Number);mesCur=ymd(new Date(y,m-2,1)).slice(0,7)}render();break;
    case 'next':if(view==='dia')cur=addDays(cur,1);else{const [y,m]=mesCur.split('-').map(Number);mesCur=ymd(new Date(y,m,1)).slice(0,7)}render();break;
    case 'gohoje':cur=today();mesCur=cur.slice(0,7);render();break;
    case 'goday':cur=b.dataset.d;view='dia';window.scrollTo(0,0);render();break;
    case 'when':addWhen=b.dataset.v;b.parentNode.querySelectorAll('[data-act=when]').forEach(x=>x.classList.toggle('on',x===b));$('#addt').focus();break;
    case 'af':addFrente=addFrente===b.dataset.v?'':b.dataset.v;b.parentNode.querySelectorAll('[data-act=af]').forEach(x=>x.classList.toggle('on',x.dataset.v===addFrente));$('#addt').focus();break;
    case 'tgl-t':toggleTarefa(id);break;
    case 'tgl-r':{const d=b.dataset.d;S.feitosRotina[d]=S.feitosRotina[d]||{};if(S.feitosRotina[d][id])delete S.feitosRotina[d][id];else S.feitosRotina[d][id]=Date.now();save();render();break}
    case 'edit-t':dlgTarefa(S.tarefas.find(t=>t.id===id));break;
    case 'edit-r':dlgRotina(S.rotinas.find(r=>r.id===id));break;
    case 'edit-f':dlgFrente(frente(id));break;
    case 'new-r':dlgRotina(null);break;
    case 'new-f':dlgFrente(null);break;
    case 'close':dlg.close();break;
    case 'amanha':{const t=S.tarefas.find(x=>x.id===id);t.data=addDays(t.data||cur,1);save();render();toast('Movida para '+curto(t.data));break}
    case 'prahoje':{const t=S.tarefas.find(x=>x.id===id);t.data=today();save();render();toast('Está no Hoje');break}
    case 'foco':S.foco=id;save();render();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'foco-off':S.foco=null;stopTimer();save();render();break;
    case 'tmr':startTimer(+b.dataset.m);break;
    case 'tmr-stop':stopTimer();break;
    case 'escala':{const e=getEsc(),i=ESCALAS.findIndex(x=>x.v===e),n=ESCALAS[(i+1)%ESCALAS.length];aplicarEsc(n.v);toast('Tela: '+n.n);if(view==='ajustes')render();break}
    case 'set-tema':aplicarTema(b.dataset.v);render();break;
    case 'crono':cronoToggle(id);break;
    case 'tgl-ck':{const t=S.tarefas.find(x=>x.id===id),c=t&&(t.check||[]).find(x=>x.id===b.dataset.ck);if(c){c.done=!c.done;save();render()}break}
    case 'ck-add':ckAdd();break;
    case 'ck-del':b.closest('.ck-e').remove();break;
    case 'set-esc':aplicarEsc(parseFloat(b.dataset.v));render();break;
    case 'del-log':Object.keys(S.diario).forEach(k=>{S.diario[k]=S.diario[k].filter(x=>x.id!==id)});save();render();break;
    case 'del-t':if(confirm('Excluir esta tarefa?')){S.tarefas=S.tarefas.filter(t=>t.id!==id);if(S.foco===id)S.foco=null;dlg.close();save();render()}break;
    case 'del-r':if(confirm('Excluir esta rotina? O histórico de marcações dela some junto.')){S.rotinas=S.rotinas.filter(r=>r.id!==id);Object.values(S.feitosRotina).forEach(o=>delete o[id]);dlg.close();save();render()}break;
    case 'del-f':if(confirm('Excluir esta frente? As tarefas dela ficam como "sem frente".')){S.frentes=S.frentes.filter(f=>f.id!==id);S.tarefas.forEach(t=>{if(t.frente===id)t.frente=''});S.rotinas.forEach(r=>{if(r.frente===id)r.frente=''});if(addFrente===id)addFrente='';dlg.close();save();render()}break;
    case 'export':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='agenda-trabalho-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}
    case 'reset':if(confirm('Apagar todas as tarefas, rotinas e o diário deste navegador? Faça um backup antes, se quiser guardar.')){S=seed();save();render();toast('Recomeçado')}break;
    case 'gh-push':ghPush(true);break;
    case 'gh-pull':ghPull(true);break;
    case 'gh-off':localStorage.removeItem(GHKEY);render();toast('Sincronização desligada');break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-act-change=tipo]')){const v=e.target.value;dlg.querySelector('#f-dias').hidden=v!=='semanal';dlg.querySelector('#f-dia').hidden=v!=='mensal'}
  if(e.target.id==='imp'){
    const file=e.target.files[0]; if(!file)return;
    file.text().then(txt=>{const d=JSON.parse(txt);if(!d||d.v!==1||!Array.isArray(d.tarefas))throw 0;if(!confirm('Substituir os dados deste navegador pelo arquivo importado?'))return;S=d;save();render();toast('Importado')}).catch(()=>toast('Arquivo não reconhecido'));
  }
});
document.addEventListener('submit',e=>{
  const f=e.target, k=f.dataset.form; if(!k)return;
  e.preventDefault();
  const fd=new FormData(f), g=n=>(fd.get(n)||'').toString().trim();
  if(k==='add'){
    const t=g('t'); if(!t)return;
    const data=addWhen==='dia'?cur:addWhen==='amanha'?addDays(cur,1):null;
    S.tarefas.push({id:uid(),titulo:t,data,frente:addFrente,done:false,criada:Date.now(),nota:''});
    save();render();$('#addt').focus();
    if(data!==cur)toast(data?'Anotada para '+curto(data):'Guardada em Frentes, sem data');
  }else if(k==='addf'){
    const t=g('t'); if(!t)return;
    const fid=f.dataset.f;
    S.tarefas.push({id:uid(),titulo:t,data:null,frente:fid,done:false,criada:Date.now(),nota:''});
    save();render();
    const nf=document.querySelector(`[data-form=addf][data-f="${fid}"] input`); if(nf)nf.focus();
  }else if(k==='log'){
    const t=g('t'); if(!t)return; addLog(cur,t); save();render();
  }else if(k==='dlg-t'){
    const t=S.tarefas.find(x=>x.id===f.dataset.id);
    ckAdd();  // item digitado e não adicionado entra também
    const fd2=new FormData(f), ids=fd2.getAll('ck_id'), txts=fd2.getAll('ck_txt'), datas=fd2.getAll('ck_data'), ok=new Set(fd2.getAll('ck_done'));
    const check=ids.map((cid,i)=>({id:cid,txt:String(txts[i]).trim(),data:datas[i]||null,done:ok.has(cid)})).filter(c=>c.txt);
    Object.assign(t,{titulo:g('titulo'),data:g('data')||null,frente:g('frente'),nota:g('nota'),check});
    const tm=f.elements.tempo;
    if(tm&&tm.value!==tm.dataset.orig){t.tempo=Math.max(0,parseInt(tm.value,10)||0)*60000;if(t.rodando)t.rodando=Date.now()}
    dlg.close();save();render();
  }else if(k==='dlg-r'){
    let r=S.rotinas.find(x=>x.id===f.dataset.id);
    if(!r){r={id:uid(),criada:today()};S.rotinas.push(r)}
    const dia=parseInt(g('dia'),10);
    Object.assign(r,{titulo:g('titulo'),frente:g('frente'),tipo:g('tipo'),dias:fd.getAll('dias').map(Number),dia:dia>=1&&dia<=31?dia:null,hora:g('hora'),pausada:fd.get('pausada')==='on'});
    if(rotSemConfig(r))toast('Falta escolher '+(r.tipo==='mensal'?'o dia do mês':'os dias')+' para ela aparecer');
    dlg.close();save();render();
  }else if(k==='dlg-f'){
    let fr=frente(f.dataset.id);
    if(!fr){fr={id:uid()};S.frentes.push(fr)}
    Object.assign(fr,{nome:g('nome'),cor:g('cor')||COLORS[0],arquivada:fd.get('arquivada')==='on'});
    dlg.close();save();render();
  }else if(k==='gh'){
    const c={repo:g('repo').replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),path:g('path')||'agenda-trabalho.json',token:g('token')};
    if(!/^[\w.-]+\/[\w.-]+$/.test(c.repo)||!c.token){toast('Preencha repositório (usuario/repositorio) e token');return}
    localStorage.setItem(GHKEY,JSON.stringify(c)); ghSha=null;
    ghPull(true).then(ok=>{if(ok!==false)ghPush(false)});
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ck-new'){e.preventDefault();ckAdd();return}
  if(e.key==='n'&&view==='dia'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!dlg.open){e.preventDefault();$('#addt').focus()}
});

/* ---------- timer de foco ---------- */
let tEnd=null,tInt=null;
function startTimer(m){tEnd=Date.now()+m*60000;clearInterval(tInt);tInt=setInterval(tick,1000);tick()}
function stopTimer(){tEnd=null;clearInterval(tInt);document.title=TITLE;tick()}
function tick(){
  const el=$('#tmr');
  if(!tEnd){if(el)el.textContent='';return}
  const r=tEnd-Date.now();
  if(r<=0){tEnd=null;clearInterval(tInt);if(el)el.textContent='00:00';beep();toast('Tempo de foco acabou. Pausa curta e volta.');document.title='Tempo acabou · '+TITLE;setTimeout(()=>document.title=TITLE,10000);return}
  const s=Math.ceil(r/1000),txt=pad(Math.floor(s/60))+':'+pad(s%60);
  if(el)el.textContent=txt; document.title=txt+' · foco';
}
function beep(){
  try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.4,.8].forEach(t=>{const o=a.createOscillator(),gn=a.createGain();o.frequency.value=880;o.connect(gn);gn.connect(a.destination);gn.gain.setValueAtTime(.2,a.currentTime+t);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.32)})}catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}

/* ---------- sincronização GitHub ---------- */
let ghSha=null,pushT=null,syncMsg='',syncCls='';
function gh(){try{return JSON.parse(localStorage.getItem(GHKEY))||{}}catch(e){return{}}}
const ghOn=()=>{const c=gh();return !!(c.token&&c.repo)};
function renderSync(){const el=$('#sync');if(!ghOn()){el.textContent='só neste aparelho';el.className='';return}el.textContent=syncMsg||'nuvem';el.className=syncCls}
function setSync(m,c){syncMsg=m;syncCls=c||'';renderSync()}
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function ghUrl(c){return `https://api.github.com/repos/${c.repo}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`}
function ghHead(c){return{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'}}
async function ghFetch(){
  const c=gh();
  const r=await fetch(ghUrl(c)+'?t='+Date.now(),{headers:ghHead(c),cache:'no-store'});
  if(r.status===404){ghSha=null;return null}
  if(!r.ok)throw new Error(r.status===401?'token inválido':'GitHub '+r.status);
  const j=await r.json(); ghSha=j.sha; return JSON.parse(b64d(j.content));
}
async function ghPull(manual){
  if(!ghOn())return;
  setSync('baixando…');
  try{
    const remoto=await ghFetch();
    if(remoto&&remoto.v===1&&(remoto.updatedAt||0)>(S.updatedAt||0)){S=remoto;persistLocal();render();if(manual)toast('Dados baixados da nuvem')}
    else if(manual)toast(remoto?'Este aparelho já está atualizado':'Arquivo ainda não existe no repositório; vou criar');
    setSync('nuvem ok '+agoraHM(),'ok'); return true;
  }catch(e){setSync('erro na nuvem','err');if(manual)toast('Não consegui baixar: '+e.message);return false}
}
function schedulePush(){if(!ghOn())return;clearTimeout(pushT);setSync('salvando…');pushT=setTimeout(()=>ghPush(false),2500)}
async function ghPush(manual,retry){
  if(!ghOn())return;
  const c=gh();
  try{
    if(ghSha===null&&!retry){try{await ghFetchShaOnly(c)}catch(e){}}
    const body={message:'agenda '+new Date().toISOString(),content:b64e(JSON.stringify(S))};
    if(ghSha)body.sha=ghSha;
    const r=await fetch(ghUrl(c),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHead(c)),body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&!retry){await ghFetchShaOnly(c);return ghPush(manual,true)}
    if(!r.ok)throw new Error(r.status===401?'token inválido':r.status===403||r.status===404?'sem permissão no repositório':'GitHub '+r.status);
    ghSha=(await r.json()).content.sha;
    setSync('nuvem ok '+agoraHM(),'ok'); if(manual)toast('Enviado para a nuvem');
  }catch(e){setSync('erro na nuvem','err');if(manual)toast('Não consegui enviar: '+e.message)}
}
async function ghFetchShaOnly(c){const r=await fetch(ghUrl(c)+'?t='+Date.now(),{headers:ghHead(c),cache:'no-store'});ghSha=r.ok?(await r.json()).sha:null}

/* ---------- utilidades ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

let ultimoHoje=today();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(today()!==ultimoHoje){if(cur===ultimoHoje)cur=today();ultimoHoje=today()}
  if(ghOn())ghPull(false); else render();
});
setInterval(()=>{if(today()!==ultimoHoje){if(cur===ultimoHoje)cur=today();ultimoHoje=today();if(!dlg.open)render()}},60000);

// atualiza na tela o cronômetro que estiver rodando
setInterval(()=>{document.querySelectorAll('[data-crono]').forEach(el=>{const t=S.tarefas.find(x=>x.id===el.dataset.crono);if(t&&t.rodando)el.textContent=fmtDur(tempoT(t),true)})},1000);

if(!S.updatedAt){S.updatedAt=1;persistLocal()}
aplicarTema(getTema());
aplicarEsc(getEsc());
render();
if(ghOn())ghPull(false);
</script>
